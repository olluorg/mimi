name: Publish Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Publishing is over-the-air: whatever lands here reaches every installed
      # app without a release. Nothing deploys unless every scene parses,
      # validates, and can actually be completed.
      - name: Validate catalog
        run: ./gradlew :core:jvmTest --tests '*CatalogIntegrityTest*' --stacktrace

      - name: Regenerate catalog index
        run: ./gradlew generateCatalogIndex

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload validation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation-reports
          path: core/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
