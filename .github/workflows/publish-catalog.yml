name: Publish Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/*.json'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate catalog.json from scene files
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys

          BASE_URL = "https://olluorg.github.io/mimi"
          catalog_dir = pathlib.Path("catalog")

          scenes = []
          for path in sorted(catalog_dir.glob("*.json")):
              if path.name == "catalog.json":
                  continue
              try:
                  data = json.loads(path.read_text())
                  scene_id = data.get("sceneId") or path.stem
                  scenes.append({"id": scene_id, "url": f"{BASE_URL}/{path.name}"})
              except Exception as e:
                  print(f"WARNING: skipping {path.name}: {e}", file=sys.stderr)

          index = {"version": 2, "scenes": scenes}
          (catalog_dir / "catalog.json").write_text(json.dumps(index, ensure_ascii=False, indent=2))
          print(f"Generated catalog.json with {len(scenes)} scenes:")
          for s in scenes:
              print(f"  {s['id']}")
          EOF

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
